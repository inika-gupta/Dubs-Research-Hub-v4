<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Researcher Profile · Dubs' Research Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f0f0f5;
  color: #1d1d1f;
  min-height: 100vh;
  transition: background 0.25s, color 0.25s;
}
body.dark { background: #0b0b0e; color: rgba(230,225,240,0.88); }

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 56px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(0,0,0,0.08);
}
body.dark nav { background: rgba(10,10,13,0.9); border-bottom-color: rgba(255,255,255,0.07); }
.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
#dubs-logo-dark  { display: none; }
#dubs-logo-light { display: block; }
body.dark  #dubs-logo-dark  { display: block; }
body.dark  #dubs-logo-light { display: none; }
body:not(.dark) #dubs-logo-dark  { display: none; }
body:not(.dark) #dubs-logo-light { display: block; }
.nav-brand span {
  font-size: 15px; font-weight: 700;
  background: linear-gradient(135deg,#44296a,#6d28d9);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
body.dark .nav-brand span {
  background: linear-gradient(135deg,#a8c4ff,#c4b5fd);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; color: rgba(0,0,0,0.4);
  text-decoration: none; padding: 5px 12px; border-radius: 8px;
  border: none; background: none; cursor: pointer; font-family: inherit;
  transition: color 0.15s, background 0.15s;
}
.nav-link:hover { color: #1d1d1f; background: rgba(0,0,0,0.05); }
body.dark .nav-link { color: rgba(255,255,255,0.4); }
body.dark .nav-link:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.06); }
.nav-right { display: flex; align-items: center; gap: 10px; }

/* ── THEME TOGGLE PILL ── */
#theme-toggle {
  display: flex; align-items: center;
  border-radius: 20px; padding: 3px;
  background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.09);
  cursor: pointer; gap: 2px;
}
body.dark #theme-toggle { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.1); }
.tt-opt {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 16px; font-size: 11px; font-weight: 600;
  color: rgba(0,0,0,0.3); transition: all 0.15s; white-space: nowrap;
  user-select: none;
}
body.dark .tt-opt { color: rgba(255,255,255,0.28); }
.tt-opt.active { background: #fff; color: #44296a; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
body.dark .tt-opt.active { background: rgba(255,255,255,0.13); color: rgba(200,215,255,0.88); box-shadow: none; }

/* ── PAGE WRAPPER ── */
.page { max-width: 1160px; margin: 0 auto; padding: 0 28px 80px; }
.breadcrumb {
  display: inline-flex; align-items: center; gap: 6px;
  margin: 20px 0 20px; font-size: 12.5px; color: #6e6e73;
  cursor: pointer; transition: color .14s; user-select: none;
}
.breadcrumb:hover { color: #44296a; }
body.dark .breadcrumb { color: rgba(255,255,255,0.35); }
body.dark .breadcrumb:hover { color: rgba(196,181,253,0.7); }

/* ── HEADER CARD ── */
.profile-header {
  background: #fff; border-radius: 20px;
  border: 1px solid rgba(0,0,0,0.07);
  padding: 28px 32px 24px; margin-bottom: 16px;
}
body.dark .profile-header { background: rgba(18,18,24,0.98); border-color: rgba(255,255,255,0.08); }

.ph-top { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
.ph-avatar {
  width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, rgba(109,40,217,0.15), rgba(68,41,106,0.15));
  border: 2px solid rgba(109,40,217,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 800; color: #5b21b6; letter-spacing: -1px;
}
body.dark .ph-avatar { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.25); color: #c4b5fd; }

.ph-info { flex: 1; min-width: 0; }
.ph-name { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; color: #111; }
body.dark .ph-name { color: rgba(240,235,255,0.96); }
.ph-role { font-size: 13.5px; color: #6e6e73; margin-bottom: 12px; }
body.dark .ph-role { color: rgba(255,255,255,0.4); }
.ph-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.ph-tag {
  font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
  border: none; background: rgba(109,40,217,0.18); color: #44296a;
}
body.dark .ph-tag { background: rgba(196,181,253,0.16); color: rgba(196,181,253,0.95); }

.ph-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; width: 248px; max-width: 40%; }
@media (max-width: 760px) { .ph-actions { width: auto; max-width: none; } }
.btn-save {
  width: 34px; height: 34px; border-radius: 9px;
  border: 1px solid rgba(0,0,0,0.1); background: none;
  color: #aeaeb2; cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: all .14s;
}
.btn-save:hover { border-color: #5b21b6; color: #5b21b6; }
body.dark .btn-save { border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.28); }
body.dark .btn-save:hover { border-color: #c4b5fd; color: #c4b5fd; }
.btn-save.saved { color: #5b21b6; border-color: rgba(91,33,182,0.3); }
body.dark .btn-save.saved { color: #c4b5fd; border-color: rgba(196,181,253,0.3); }

/* ── STATS BAR ── */
.ph-stats {
  display: flex; align-items: center;
  border-top: 1px solid rgba(0,0,0,0.06); padding-top: 18px;
}
body.dark .ph-stats { border-top-color: rgba(255,255,255,0.07); }
.stat-item {
  display: flex; align-items: baseline; gap: 5px;
  padding-right: 24px; margin-right: 24px;
  border-right: 1px solid rgba(0,0,0,0.07);
}
.stat-item:last-child { border-right: none; padding-right: 0; margin-right: 0; }
body.dark .stat-item { border-right-color: rgba(255,255,255,0.07); }
.stat-num { font-size: 19px; font-weight: 800; color: #111; letter-spacing: -0.5px; }
body.dark .stat-num { color: rgba(240,235,255,0.96); }
.stat-label { font-size: 11.5px; color: #aeaeb2; font-weight: 500; }
body.dark .stat-label { color: rgba(255,255,255,0.32); }

/* ── BODY: TWO COLUMNS ── */
.profile-body {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 900px) { .profile-body { grid-template-columns: 1fr; } }

/* ── LEFT COLUMN ── */
.col-left {
  background: #fff; border-radius: 20px;
  border: 1px solid rgba(0,0,0,0.07); overflow: hidden;
}
body.dark .col-left { background: rgba(18,18,24,0.98); border-color: rgba(255,255,255,0.08); }

/* Tab bar */
.tab-bar {
  display: flex; align-items: center;
  border-bottom: 1px solid rgba(0,0,0,0.07); padding: 0 28px;
}
body.dark .tab-bar { border-bottom-color: rgba(255,255,255,0.07); }
.tab-btn {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13.5px; font-weight: 600; color: #aeaeb2;
  background: none; border: none; cursor: pointer; font-family: inherit;
  padding: 15px 0; margin-right: 26px; border-bottom: 2px solid transparent;
  transition: color .14s;
}
.tab-btn.active { color: #1d1d1f; border-bottom-color: #5b21b6; }
body.dark .tab-btn { color: rgba(255,255,255,0.32); }
body.dark .tab-btn.active { color: rgba(240,235,255,0.96); border-bottom-color: #c4b5fd; }
.tab-badge {
  font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  background: rgba(0,0,0,0.06); color: #6e6e73;
}
body.dark .tab-badge { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }
.tab-btn.active .tab-badge { background: rgba(91,33,182,0.12); color: #5b21b6; }
body.dark .tab-btn.active .tab-badge { background: rgba(196,181,253,0.16); color: #c4b5fd; }

/* Tab panels */
.tab-panel { display: none; padding: 26px 28px; }
.tab-panel.active { display: block; }

/* Bio */
.bio-text { font-size: 14px; line-height: 1.75; color: #3d3d3f; margin-bottom: 20px; }
body.dark .bio-text { color: rgba(220,215,240,0.68); }

/* Working on card */
.working-card {
  background: rgba(0,0,0,0.025); border-radius: 14px;
  border: 1px solid rgba(0,0,0,0.07); padding: 17px 19px; margin-bottom: 18px;
}
body.dark .working-card { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.08); }
.working-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; font-weight: 800; letter-spacing: 0.11em;
  text-transform: uppercase; color: #34c759; margin-bottom: 9px;
}
.wl-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #34c759;
  animation: pulse 2s ease-in-out infinite; flex-shrink: 0;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.35} }
.working-title { font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 7px; color: #111; }
body.dark .working-title { color: rgba(240,235,255,0.95); }
.working-desc { font-size: 13px; line-height: 1.65; color: #6e6e73; margin-bottom: 9px; }
body.dark .working-desc { color: rgba(255,255,255,0.4); }
.working-details { font-size: 11.5px; color: #aeaeb2; font-weight: 500; }
body.dark .working-details { color: rgba(255,255,255,0.28); }

/* Looking for */
.looking-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin-bottom: 24px;
}
.looking-label { font-size: 13px; color: #6e6e73; font-weight: 500; flex-shrink: 0; }
body.dark .looking-label { color: rgba(255,255,255,0.36); }
.lf-tag {
  font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
  border: none; background: rgba(109,40,217,0.18); color: #44296a;
}
body.dark .lf-tag { background: rgba(196,181,253,0.16); color: rgba(196,181,253,0.95); }

/* Selected research */
.sr-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.sr-title { font-size: 15px; font-weight: 700; color: #111; }
body.dark .sr-title { color: rgba(240,235,255,0.95); }
.sr-counter { font-size: 12px; color: #aeaeb2; font-weight: 500; }
body.dark .sr-counter { color: rgba(255,255,255,0.3); }

.paper-item {
  display: block; padding: 14px 12px; margin: 0 -12px;
  border-bottom: 1px solid rgba(0,0,0,0.06); border-radius: 10px;
  text-decoration: none; color: inherit; cursor: pointer; transition: background .14s;
}
.paper-item:hover { background: rgba(91,33,182,0.04); }
.paper-item:hover .paper-link-hint { opacity: 1; }
.paper-item:last-child { border-bottom: none; }
body.dark .paper-item { border-bottom-color: rgba(255,255,255,0.06); }
body.dark .paper-item:hover { background: rgba(196,181,253,0.06); }
.paper-link-hint { color: #5b21b6; font-weight: 700; opacity: 0.7; transition: opacity .14s; }
body.dark .paper-link-hint { color: #c4b5fd; }
.paper-title { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 5px; line-height: 1.4; }
body.dark .paper-title { color: rgba(230,225,240,0.92); }
.paper-desc { font-size: 13px; line-height: 1.6; color: #6e6e73; margin-bottom: 6px; }
body.dark .paper-desc { color: rgba(255,255,255,0.4); }
.paper-venue { font-size: 11.5px; font-weight: 600; color: #aeaeb2; }
body.dark .paper-venue { color: rgba(255,255,255,0.28); }

/* ── CONTACT ROW (inside header card) ── */
.ph-contact {
  margin-top: 16px; padding-top: 14px;
  border-top: 1px solid rgba(0,0,0,0.06);
}
body.dark .ph-contact { border-top-color: rgba(255,255,255,0.07); }
.ph-contact-links {
  display: flex; flex-direction: column; align-items: stretch; gap: 7px;
  width: 100%; margin-top: 2px;
}
@media (max-width: 760px) { .ph-contact-links { flex-direction: row; flex-wrap: wrap; } }
.contact-link {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 500; color: #3d3d3f;
  text-decoration: none; padding: 9px 12px; border-radius: 10px;
  border: 1px solid rgba(0,0,0,0.08); background: rgba(0,0,0,0.015);
  transition: all .14s; cursor: pointer; font-family: inherit;
}
.contact-link:hover { border-color: rgba(91,33,182,0.28); background: rgba(91,33,182,0.04); color: #5b21b6; }
body.dark .contact-link { border-color: rgba(255,255,255,0.08); background: rgba(255,255,255,0.025); color: rgba(220,215,240,0.7); }
body.dark .contact-link:hover { border-color: rgba(196,181,253,0.25); color: #c4b5fd; background: rgba(196,181,253,0.05); }
.cl-icon {
  width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.cl-email   { background: rgba(109,40,217,0.09); color: #5b21b6; }
.cl-linkedin{ background: rgba(10,102,194,0.09); color: #0a66c2; }
.cl-uw      { background: rgba(75,0,130,0.07);  color: #4B0082; }
.cl-scholar { background: rgba(0,0,0,0.05);     color: #3d3d3f; }
.cl-web     { background: rgba(68,41,106,0.07); color: #44296a; }
body.dark .cl-email    { background: rgba(196,181,253,0.09); color: #c4b5fd; }
body.dark .cl-linkedin { background: rgba(100,170,255,0.08); color: rgba(130,195,255,0.85); }
body.dark .cl-uw       { background: rgba(196,181,253,0.08); color: rgba(196,181,253,0.82); }
body.dark .cl-scholar  { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.52); }
body.dark .cl-web      { background: rgba(168,196,255,0.07); color: rgba(168,196,255,0.8); }
.cl-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── SAVE-TO-LIBRARY TOAST ── */
#save-toast {
  position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 16px);
  background: #1d1d1f; color: #fff; font-size: 13px; font-weight: 600;
  padding: 11px 20px; border-radius: 11px; z-index: 9999;
  box-shadow: 0 8px 30px rgba(0,0,0,0.28);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#save-toast.show { opacity: 1; transform: translate(-50%, 0); }
body.dark #save-toast { background: #2c2c34; }

/* ── CONNECTIONS PANEL ── */
.connections-list { display: flex; flex-direction: column; gap: 13px; }
.conn-item { display: flex; align-items: center; gap: 13px; }
.conn-avatar {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  background: rgba(68,41,106,0.09); border: 1px solid rgba(68,41,106,0.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #44296a;
}
body.dark .conn-avatar { background: rgba(168,196,255,0.08); border-color: rgba(168,196,255,0.18); color: #a8c4ff; }
.conn-name { font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
.conn-role { font-size: 12px; color: #6e6e73; }
body.dark .conn-role { color: rgba(255,255,255,0.36); }
.conn-type {
  margin-left: auto; font-size: 11px; font-weight: 600; padding: 4px 12px;
  border-radius: 20px; background: rgba(52,199,89,0.12); color: #1a8a3a;
  flex-shrink: 0;
}
body.dark .conn-type { background: rgba(52,199,89,0.12); color: rgba(80,220,120,0.95); }
/* Collab network SVG container */
#collab-network-svg {
  width: 100%; border-radius: 14px;
  background: rgba(109,40,217,0.03);
  display: block;
}
body.dark #collab-network-svg { background: rgba(109,40,217,0.06); }
.collab-net-legend {
  display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 0 4px;
  font-size: 11px; font-weight: 600; color: #6e6e73;
  align-items: center;
}
body.dark .collab-net-legend { color: rgba(255,255,255,0.4); }
.collab-net-legend-dot {
  width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px;
}
#collab-net-tooltip {
  position: fixed; pointer-events: none; z-index: 999;
  background: rgba(255,255,255,0.96); border-radius: 10px;
  padding: 8px 12px; font-size: 12px; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.14);
  color: #1d1d1f; display: none; max-width: 200px; line-height: 1.5;
}
body.dark #collab-net-tooltip {
  background: rgba(28,20,40,0.97); color: rgba(230,225,240,0.92);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

/* ── RIGHT COLUMN — sticky AI panel, fixed viewport height ── */
.col-right {
  position: sticky;
  top: 72px;
  height: calc(100vh - 88px);
  /* Sticky sidebar needs a real height, but that height must NOT inflate the grid
     row — otherwise the right column drives extra scroll below the left content
     (connections / about). Negative margin cancels the block's flow contribution
     while the panel still renders at full viewport height once stuck. */
  margin-bottom: calc(88px - 100vh);
  display: flex;
  flex-direction: column;
  align-self: start;
}
@media (max-width: 900px) {
  .col-right {
    position: static;
    height: auto;
    max-height: 70vh;
    margin-bottom: 0;
  }
}

/* AI panel fills the column */
.ai-panel {
  flex: 1;
  display: flex; flex-direction: column;
  border-radius: 20px; overflow: hidden;
  background: linear-gradient(160deg,
    rgba(109,40,217,0.07) 0%,
    rgba(68,41,106,0.05) 45%,
    rgba(167,139,250,0.09) 100%);
  border: 1px solid rgba(109,40,217,0.13);
  backdrop-filter: blur(20px);
}
body.dark .ai-panel {
  background: linear-gradient(160deg,
    rgba(109,40,217,0.12) 0%,
    rgba(68,41,106,0.08) 45%,
    rgba(167,139,250,0.14) 100%);
  border-color: rgba(167,139,250,0.18);
}

/* AI header */
.ai-header-row {
  display: flex; align-items: center; gap: 9px;
  padding: 20px 22px 16px; flex-shrink: 0;
  border-bottom: 1px solid rgba(109,40,217,0.08);
}
body.dark .ai-header-row { border-bottom-color: rgba(167,139,250,0.1); }
.ai-icon {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  background: linear-gradient(135deg,#5b21b6,#44296a);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700; line-height: 1;
}
.ai-title { font-size: 13.5px; font-weight: 700; color: #111; }
body.dark .ai-title { color: rgba(240,235,255,0.95); }

/* Scrollable response area */
.ai-response-wrap {
  flex: 1; overflow-y: auto; padding: 16px 22px 8px;
  scrollbar-width: thin; scrollbar-color: rgba(109,40,217,0.12) transparent;
}
.ai-empty {
  height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: rgba(109,40,217,0.32); text-align: center;
  font-style: italic; line-height: 1.6; padding: 20px;
}
body.dark .ai-empty { color: rgba(196,181,253,0.25); }
.ai-response-area {
  font-size: 13px; line-height: 1.7; color: #3d3d3f; display: none;
}
body.dark .ai-response-area { color: rgba(220,215,240,0.75); }

/* Controls */
.ai-controls {
  padding: 14px 22px 20px; flex-shrink: 0;
  border-top: 1px solid rgba(109,40,217,0.1);
}
body.dark .ai-controls { border-top-color: rgba(167,139,250,0.13); }

/* Overlap chip — slightly more prominent than regular chips */
.ai-chip-overlap {
  background: rgba(109,40,217,0.25) !important;
  color: #44296a !important;
}
.ai-chip-overlap:hover {
  background: rgba(109,40,217,0.32) !important;
}
body.dark .ai-chip-overlap {
  background: rgba(167,139,250,0.24) !important;
  color: #c4b5fd !important;
}
body.dark .ai-chip-overlap:hover {
  background: rgba(167,139,250,0.32) !important;
}

/* Search row */
.ai-search-row { display: flex; gap: 8px; margin-bottom: 11px; }

const DOMAIN_WORK = {

  'health':       { title: 'Designing technology for long-term health behavior maintenance', desc: 'An 18-month longitudinal study examining what makes healthy behaviors persist after the first 90 days of using a health app.', details: 'Longitudinal · 18 months' },
  'default':      { title: 'Current empirical research in human-computer interaction', desc: 'Conducting ongoing studies that generate new findings and design implications for the field.', details: 'Ongoing research' }
};
function domainWork(sub) {
  if (!sub) return DOMAIN_WORK['default'];
  const s = sub.toLowerCase();
  if (/access|disab|impair/.test(s)) return DOMAIN_WORK['accessibility'];
  if (/ai|machine|intelligence|learn/.test(s)) return DOMAIN_WORK['ai'];
  if (/health|wellbeing|mental|medical/.test(s)) return DOMAIN_WORK['health'];
  return DOMAIN_WORK['default'];
}
function buildGenericProfile(id, name, subName, pc) {
  const words = name.trim().split(/\s+/);
  const firstName = words[0];
  const emailLoc  = name.toLowerCase().replace(/[^a-z]/g,'').slice(0,10);
  const work = domainWork(subName);
  const estimatedCitations = pc * 42;
  const estimatedH = Math.max(4, Math.floor(Math.sqrt(pc * 8)));
  return {
    name, role: `Researcher · ${subName || 'University of Washington'} · UW`,
    tags: [subName, 'UW Research', 'HCI'].filter(Boolean).slice(0,3),
    stats: { publications: pc, citations: estimatedCitations, hindex: estimatedH, collaborators: Math.floor(pc / 3), activeSince: 2010 },
    bio: `${firstName} is a researcher at the University of Washington with ${pc} indexed publications. Their work focuses on ${subName || 'human-computer interaction'}, combining rigorous empirical methods with practical design implications.`,
    currentWork: work,
    lookingFor: ['Research collaborator', 'Study participants', 'Industry partner'],
    papers: (() => {
      // Try real generated papers passed from landing.html via sessionStorage
      try {
        const stored = sessionStorage.getItem('dubslab-profile-papers');
        const storedName = sessionStorage.getItem('dubslab-profile-name');
        if (stored && storedName === name) {
          const raw = JSON.parse(stored);
          if (Array.isArray(raw) && raw.length > 0) {
            return raw.slice(0, Math.min(pc, 200)).map(p => ({
              title:     p.title,
              desc:      `Published in ${p.journal} · ${p.year}.`,
              venue:     `${p.journal} · ${p.year}`,
              citations: p.citations || 0,
              link:      p.link || ''
            }));
          }
        }
      } catch(e) {}
      // Fallback: still better than "Research publication N" — use journal abbreviations
      return Array.from({ length: Math.min(pc, 8) }, (_, i) => ({
        title: `${subName || 'HCI'}: a longitudinal study (${2024-i})`,
        desc:  `An empirical study contributing findings and design implications to ${subName || 'HCI'}.`,
        venue: ['CHI','CSCW','ASSETS','UIST','IMWUT','DIS','TOCHI','IUI'][i % 8] + ` · ${2024-i}`,
        citations: Math.max(0, Math.floor(estimatedCitations / (i+1) * 0.35))
      }));
    })(),
    collaborators: [],
    aiChips: [`Explain ${firstName}'s research`, 'What methods?', 'Open to collaborating?'],
    aiAnswers: {
      [`Explain ${firstName}'s research`]: `${name} researches ${subName || 'HCI'} at the University of Washington, with ${pc} publications contributing to both theory and practice in the field.`,

function _buildCollabNetwork(collabs) {
  const isDark = document.body.classList.contains('dark');
  const wrap   = document.getElementById('collab-network-wrap');
  const legend = document.getElementById('collab-net-legend');
  const tip    = document.getElementById('collab-net-tooltip');
  if (!wrap || !window.d3) return;

  // Color scheme matching the main network
  const COLOR = {
    focal:    isDark ? { fill: 'rgba(167,139,250,0.25)', stroke: 'rgba(167,139,250,0.7)', text: 'rgba(230,225,240,0.95)' }
                     : { fill: 'rgba(109,40,217,0.12)',  stroke: 'rgba(109,40,217,0.55)', text: '#44296a' },
    'uw-same': isDark ? { fill: 'rgba(52,211,153,0.18)', stroke: 'rgba(52,211,153,0.6)', text: 'rgba(52,211,153,0.95)' }
                      : { fill: 'rgba(34,197,94,0.12)',  stroke: 'rgba(22,163,74,0.5)',  text: '#166534' },
    'uw-cross':isDark ? { fill: 'rgba(52,211,153,0.1)',  stroke: 'rgba(52,211,153,0.4)', text: 'rgba(52,211,153,0.8)' }
                      : { fill: 'rgba(34,197,94,0.08)',  stroke: 'rgba(22,163,74,0.35)', text: '#1a7a42' },
    'ext':    isDark ? { fill: 'rgba(251,191,36,0.15)',  stroke: 'rgba(251,191,36,0.55)',text: 'rgba(251,191,36,0.9)' }
                     : { fill: 'rgba(245,158,11,0.12)',  stroke: 'rgba(180,100,0,0.5)', text: '#92400e' },
    'ind':    isDark ? { fill: 'rgba(251,191,36,0.1)',   stroke: 'rgba(251,191,36,0.4)', text: 'rgba(251,191,36,0.8)' }
                     : { fill: 'rgba(245,158,11,0.08)',  stroke: 'rgba(180,100,0,0.38)',text: '#a36010' },
  };

  const W = wrap.getBoundingClientRect().width || 560;
  const H = Math.min(320, W * 0.58);
  const cx = W / 2, cy = H / 2;

  // Build nodes
  const focalNode = { id: '_focal', name: P.name || resName, type: 'focal', fx: cx, fy: cy, r: 30 };
  const collabNodes = collabs.map((c, i) => ({
    id: c.id || ('c' + i), name: c.name,
    type: c.type || 'uw-same',
    institution: c.institution || c.role || '',
    r: 21,
  }));
  const nodes  = [focalNode, ...collabNodes];
  const links  = collabNodes.map(c => ({ source: '_focal', target: c.id }));

  // Force simulation — run synchronously for stable layout
  const sim = d3.forceSimulation(nodes)
    .force('link',    d3.forceLink(links).id(d => d.id).distance(W * 0.22).strength(0.6))
    .force('charge',  d3.forceManyBody().strength(-120))
    .force('collide', d3.forceCollide(d => d.r + 8).strength(0.85))
    .force('x', d3.forceX(cx).strength(0.06))
    .force('y', d3.forceY(cy).strength(0.06))
    .stop();
  for (let i = 0; i < 300; i++) sim.tick();

  // Clamp to bounds
  nodes.forEach(n => {
    n.x = Math.max(n.r + 4, Math.min(W - n.r - 4, n.x));
    n.y = Math.max(n.r + 4, Math.min(H - n.r - 4, n.y));
  });
  const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

  // Render SVG
  wrap.innerHTML = '';
  const svg = d3.select(wrap).append('svg')
    .attr('id', 'collab-network-svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('height', H);

  // Lines
  svg.append('g').selectAll('line')
    .data(links).join('line')
    .attr('x1', d => nodeById['_focal'].x)
    .attr('y1', d => nodeById['_focal'].y)
    .attr('x2', d => nodeById[d.target.id || d.target].x)
    .attr('y2', d => nodeById[d.target.id || d.target].y)
    .attr('stroke', isDark ? 'rgba(255,255,255,0.09)' : 'rgba(0,0,0,0.08)')
    .attr('stroke-width', 1.5)
    .attr('stroke-dasharray', d => {
      const t = nodeById[d.target.id || d.target]?.type;
      return (t === 'ext' || t === 'ind') ? '4,3' : 'none';
    });

  // Nodes
  const ng = svg.append('g').selectAll('g')
    .data(nodes).join('g')
    .style('cursor', 'default');

  ng.append('circle')
    .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', d => d.r)
    .attr('fill', d => COLOR[d.type]?.fill || COLOR['uw-same'].fill)
    .attr('stroke', d => COLOR[d.type]?.stroke || COLOR['uw-same'].stroke)
    .attr('stroke-width', 1.5);

  // Labels — 2-line: initial + last name
  ng.each(function(d) {
    const g = d3.select(this);
    const col = COLOR[d.type] || COLOR['uw-same'];
    const parts = (d.name || '').trim().split(/\s+/);
    const lastName = parts.length >= 2 ? parts[parts.length - 1] : (parts[0] || '');
    const trunc = lastName.length > 8 ? lastName.slice(0,7) + '…' : lastName;
    const t = g.append('text')
      .attr('text-anchor', 'middle').attr('font-size', d.type === 'focal' ? 9 : 7.5)
      .attr('font-weight', '700').attr('fill', col.text).attr('pointer-events', 'none');
    if (parts.length >= 2) {
      t.append('tspan').attr('x', d.x).attr('y', d.y).attr('dy', '-4').text(parts[0][0] + '.');
      t.append('tspan').attr('x', d.x).attr('dy', '10').text(trunc);
    } else {
      t.append('tspan').attr('x', d.x).attr('y', d.y).attr('dominant-baseline', 'middle').text(trunc);
    }
  });

  // Tooltip
  ng.on('mouseenter', function(event, d) {
    if (d.type === 'focal') return;
    tip.style.display = 'block';
    const typeLabel = { 'uw-same': 'UW · Same dept', 'uw-cross': 'UW · Cross-domain', 'ext': 'External collaborator', 'ind': 'Industry partner' };
    tip.innerHTML = `<strong>${d.name}</strong>${d.institution ? `<br><span style="font-weight:500;opacity:0.7">${d.institution}</span>` : ''}<br><span style="opacity:0.55;font-size:10px">${typeLabel[d.type] || d.type}</span>`;
  }).on('mousemove', function(event) {
    tip.style.left = (event.clientX + 14) + 'px';
    tip.style.top  = (event.clientY - 38) + 'px';
  }).on('mouseleave', function() {
    tip.style.display = 'none';
  });

  // Legend
  legend.style.display = 'flex';
  const legendItems = [
    { dot: COLOR['focal'].stroke,    label: resName.split(' ')[0] + ' (you)' },
    { dot: COLOR['uw-same'].stroke,  label: 'UW colleague' },
    { dot: COLOR['ext'].stroke,      label: 'External / industry' },
  ];
  legend.innerHTML = legendItems.map(l =>
    `<span style="display:flex;align-items:center"><span class="collab-net-legend-dot" style="background:${l.dot}"></span>${l.label}</span>`
  ).join('');
}

let _aiMode = 'about';

function setAiMode(mode, btn) {
  _aiMode = mode;
  document.querySelectorAll('.ai-toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('ai-input').placeholder = mode === 'overlap'
    ? 'Describe your research to find overlap…'
    : `Search ${firstName}'s research…`;
  // Clear response area when switching modes
  document.getElementById('ai-empty').style.display = '';
  document.getElementById('ai-response').style.display = 'none';
  document.getElementById('ai-input').value = '';
}

function runAi() {
  const q = document.getElementById('ai-input').value.trim();
  if (!q) return;
  const emptyEl    = document.getElementById('ai-empty');
  const responseEl = document.getElementById('ai-response');
  const answer = _aiMode === 'overlap'
    ? `Based on your description, the strongest overlap with ${firstName}'s work is in ${P.tags.slice(0,2).join(' and ')}. ${firstName} has ${P.stats.publications} publications in this area and is actively seeking collaborators.`
    : (P.aiAnswers[q] || `${firstName} has ${P.stats.publications} publications on ${P.tags.slice(0,2).join(' and ')}. Their most recent work focuses on ${P.currentWork ? P.currentWork.title.toLowerCase() : P.tags[0]}.`);
  emptyEl.style.display    = 'none';
  responseEl.style.display = 'block';
  responseEl.textContent   = '';
  let i = 0;
  const interval = setInterval(() => {
    responseEl.textContent += answer[i++] || '';
    if (i >= answer.length) clearInterval(interval);
  }, 16);
}

/* ═══════════════════════════════════════════════════════════════════════════
   SAVE TO LIBRARY — persists the researcher in localStorage (shared key with
   the rest of the app). Reflects saved state on load and toggles on click.
═══════════════════════════════════════════════════════════════════════════ */
const LIB_KEY = 'dubslab-library';
function _libRead()  { try { return JSON.parse(localStorage.getItem(LIB_KEY) || '[]'); } catch(e) { return []; } }
function _libWrite(a){ try { localStorage.setItem(LIB_KEY, JSON.stringify(a)); } catch(e) {} }
function _libItemId(){ return resId || P.name; }

function _setSaveBtnState(btn, saved) {
  btn.classList.toggle('saved', saved);
  btn.title = saved ? 'Saved — click to remove' : 'Save to library';
  const svg = btn.querySelector('svg');
  if (svg) svg.setAttribute('fill', saved ? 'currentColor' : 'none');
}

function _saveToast(msg) {
  let t = document.getElementById('save-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'save-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1700);
}

function toggleSaveLibrary(btn) {
  const lib = _libRead();
  const id  = _libItemId();
  const idx = lib.findIndex(x => x.id === id);
  if (idx >= 0) {
    lib.splice(idx, 1);
    _libWrite(lib);
    _setSaveBtnState(btn, false);
    _saveToast('Removed from library');
  } else {
    lib.push({ id, type: 'researcher', name: P.name, sub: resSub || '', pc: P.stats.publications || 0, savedAt: Date.now() });
    _libWrite(lib);
    _setSaveBtnState(btn, true);
    _saveToast('Saved to library');
  }
}

// Reflect saved state when the page loads
(function initSaveBtn() {
  const btn = document.getElementById('btn-save');
  if (!btn) return;
  const saved = _libRead().some(x => x.id === _libItemId());
  if (saved) _setSaveBtnState(btn, true);
})();

/* ═══════════════════════════════════════════════════════════════════════════
   THEME — reads same key as landing.html ('dubslab-theme')
═══════════════════════════════════════════════════════════════════════════ */
function applyTheme(isDark) {
  document.body.classList.toggle('dark', isDark);
  document.querySelector('.tt-dark').classList.toggle('active', isDark);
  document.querySelector('.tt-light').classList.toggle('active', !isDark);
  try { localStorage.setItem('dubslab-theme', isDark ? 'dark' : 'light'); } catch(e) {}
}
function toggleTheme() {
  applyTheme(!document.body.classList.contains('dark'));
}
// Init — read saved preference from the same key landing.html writes
(function() {
  let saved = null;
  try { saved = localStorage.getItem('dubslab-theme'); } catch(e) {}
  applyTheme(saved === 'dark');
})();
</script>
